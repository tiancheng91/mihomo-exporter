name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Verify
        run: |
          go test -race ./...
          go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build_target() {
            goos="$1"
            goarch="$2"
            base="mihomo-exporter_${VERSION}_${goos}_${goarch}"
            stage="$(mktemp -d)"
            binary="mihomo-exporter"

            if [ "$goos" = "windows" ]; then
              binary="mihomo-exporter.exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
              -o "$stage/$binary" ./cmd/mihomo-exporter

            cp LICENSE README.md CHANGELOG.md "$stage/"

            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/dist/${base}.zip" .)
            else
              tar -czf "dist/${base}.tar.gz" -C "$stage" .
            fi
          }

          build_target linux amd64
          build_target linux arm64
          build_target darwin amd64
          build_target darwin arm64
          build_target windows amd64
          build_target windows arm64

          (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md does not contain release notes for ${version}" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
